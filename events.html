<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout portal — Events and availability</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3EE}
a{color:#2F6B45}a:hover{color:#1F4A30}
</style>
<script src="dc-runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template"><root>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: #1C2420; background: #F4F3EE">
<nav aria-label="Main" style="flex: 1 1 220px; box-sizing: border-box; background: #1F3D2B; color: #F3F1EA; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; padding: 0 12px 4px">[Your Scout Group]</div>
<div style="font-size: 13px; color: #C8D3CB; padding: 0 12px 20px">Leaders' portal</div>
<a href="index.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E8ECE9; text-decoration: none; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Dashboard</a>
<a href="events.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events &amp; availability</a>
<a href="files.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E8ECE9; text-decoration: none; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Files</a>
<a href="payments.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E8ECE9; text-decoration: none; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 10h20"></path></svg>Subs &amp; payments</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700">Events &amp; availability</h1>
<div style="font-size: 15px; color: #5B6660; margin-top: 4px">Pick an event, say whether you can make it, and see if enough leaders are coming.</div>
</div>
<button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #2F6B45; color: #FFFFFF; font: 600 15px Inter, sans-serif; cursor: pointer">New event</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div role="list" aria-label="Upcoming events" style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{events}}" as="ev" hint-placeholder-count="4">
<button type="button" role="listitem" onClick="{{ev.pick}}" style="{{ev.cardStyle}}">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
<span style="font-weight: 600; font-size: 16px">{{ev.title}}</span>
<span style="{{ev.badgeStyle}}">{{ev.badge}}</span>
</span>
<span style="display: block; font-size: 14px; color: #5B6660; margin-top: 4px">{{ev.when}}</span>
</button>
</sc-for>
</div>

<section aria-labelledby="ev-h" style="flex: 2 1 460px; min-width: 0; background: #FFFFFF; border-radius: 12px; border: 1px solid #E2E1DA; padding: 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div>
<h2 id="ev-h" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px">{{cur.title}}</h2>
<div style="font-size: 15px; color: #5B6660; margin-top: 4px">{{cur.when}} · {{cur.place}}</div>
</div>
<span style="{{cur.badgeStyle}}">{{cur.badge}}</span>
</div>

<div style="margin-top: 20px">
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500"><span>{{cur.confirmed}} of {{cur.needed}} leaders confirmed</span><span style="color: #5B6660">Minimum needed: {{cur.needed}}</span></div>
<div style="height: 10px; border-radius: 5px; background: #E7E6DF; margin-top: 8px"><div style="{{cur.barStyle}}"></div></div>
</div>

<div style="margin-top: 24px; padding: 16px; border-radius: 10px; background: #F4F3EE; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div style="flex: 1 1 200px; font-size: 15px"><strong>Can you make it?</strong> <span style="color: #5B6660">Your answer: {{cur.myLabel}}</span></div>
<button type="button" onClick="{{setYes}}" style="{{yesStyle}}">I'm available</button>
<button type="button" onClick="{{setMaybe}}" style="{{maybeStyle}}">Maybe</button>
<button type="button" onClick="{{setNo}}" style="{{noStyle}}">Can't make it</button>
</div>

<h3 style="margin: 24px 0 8px; font-size: 15px; color: #3E4642">Leaders</h3>
<div role="list" style="display: flex; flex-direction: column">
<sc-for list="{{cur.rows}}" as="r" hint-placeholder-count="7">
<div role="listitem" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #ECEBE5">
<span style="font-size: 15px">{{r.name}}</span>
<span style="{{r.pill}}">{{r.label}}</span>
</div>
</sc-for>
</div>
</section>
</div>
</main>
</div>
</root></script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 'hike', mine: {} };
}
renderVals() {
var self = this;
var sel = (this.state && this.state.sel) || 'hike';
var mine = (this.state && this.state.mine) || {};
var leaders = ['Mary K.', 'Declan O.', 'Niamh B.', 'Paul F.', 'Gráinne D.', 'Tom H.'];
var data = [
{ id: 'meet', title: "Leaders' planning meeting", when: 'Tue 1 Dec · 19:30', place: 'Scout Den', needed: 5, st: ['yes','yes','yes','maybe','no','yes'] },
{ id: 'hike', title: 'Winter hike', when: 'Sun 6 Dec · 09:30', place: 'Meet at Scout Den', needed: 4, st: ['yes','yes','yes','no','maybe','none'] },
{ id: 'carols', title: 'Carol singing fundraiser', when: 'Sat 12 Dec · 14:00', place: '[Venue]', needed: 6, st: ['yes','yes','yes','yes','yes','yes'] },
{ id: 'party', title: 'Christmas party', when: 'Fri 18 Dec · 18:30', place: 'Scout Den', needed: 4, st: ['yes','none','none','none','yes','none'] }
];
var labels = { yes: 'Available', maybe: 'Maybe', no: "Can't make it", none: 'No reply' };
var pills = {
yes: 'padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #E3F1E7; color: #1F5B35',
maybe: 'padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FCEBD5; color: #7A3605',
no: 'padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #ECEBE5; color: #3E4642',
none: 'padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #5B6660; border: 1px solid #B9BDB8'
};
var okBadge = 'flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E3F1E7; color: #1F5B35';
var shortBadge = 'flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FCEBD5; color: #7A3605';
var events = data.map(function (ev) {
var me = mine[ev.id] || 'none';
var rows = [{ name: 'You (Steve)', st: me }].concat(leaders.map(function (n, i) { return { name: n, st: ev.st[i] }; }));
rows = rows.map(function (r) { return { name: r.name, label: labels[r.st], pill: pills[r.st] }; });
var confirmed = [me].concat(ev.st).filter(function (s) { return s === 'yes'; }).length;
var short = Math.max(0, ev.needed - confirmed);
var pct = Math.min(100, Math.round(confirmed / ev.needed * 100));
var active = ev.id === sel;
return {
id: ev.id, title: ev.title, when: ev.when, place: ev.place, needed: ev.needed, confirmed: confirmed, rows: rows,
myLabel: labels[me],
badge: short === 0 ? 'Covered' : 'Short ' + short,
badgeStyle: short === 0 ? okBadge : shortBadge,
barStyle: 'height: 10px; border-radius: 5px; width: ' + pct + '%; background: ' + (short === 0 ? '#2F6B45' : '#C2620E'),
cardStyle: 'display: block; width: 100%; text-align: left; font: inherit; color: #1C2420; cursor: pointer; padding: 16px; border-radius: 10px; background: #FFFFFF; border: ' + (active ? '2px solid #2F6B45' : '1px solid #E2E1DA') + '; margin: ' + (active ? '0' : '1px 0'),
pick: function () { self.setState({ sel: ev.id }); }
};
});
var cur = events.filter(function (e) { return e.id === sel; })[0] || events[0];
var curMine = mine[cur.id] || 'none';
function setMine(v) { var m = Object.assign({}, mine); m[cur.id] = v; self.setState({ mine: m }); }
function btn(on) {
return 'min-height: 44px; padding: 0 16px; border-radius: 8px; font: 600 15px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #2F6B45; color: #FFFFFF; border: 1px solid #2F6B45' : 'background: #FFFFFF; color: #1C2420; border: 1px solid #B9BDB8');
}
return {
events: events, cur: cur,
setYes: function () { setMine('yes'); },
setMaybe: function () { setMine('maybe'); },
setNo: function () { setMine('no'); },
yesStyle: btn(curMine === 'yes'), maybeStyle: btn(curMine === 'maybe'), noStyle: btn(curMine === 'no')
};
}
}
</script>
</body>
</html>
