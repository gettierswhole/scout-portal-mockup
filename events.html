<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout portal — Events and availability</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=IM+Fell+English:ital@0;1&amp;family=UnifrakturMaguntia&amp;display=swap">
<style>
body{margin:0;background:#E9E2CF}
a{color:#7A2A1C}a:hover{color:#5A1C12}
</style>
<script src="dc-runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template"><root>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'EB Garamond', Georgia, serif; color: #231F1A; background: #E9E2CF">
<nav aria-label="Main" style="flex: 1 1 220px; box-sizing: border-box; background: #2B2620; color: #F3F1EA; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 26px; padding: 0 12px 4px">The Great Cornholio!</div>
<div style="font-size: 14px; color: #CFC4AE; padding: 0 12px 20px">Galway Scouts · Leaders' portal</div>
<a href="index.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Dashboard</a>
<a href="events.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events &amp; availability</a>
<a href="files.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Files</a>
<a href="members.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>Members</a>
<a href="payments.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 10h20"></path></svg>Subs &amp; payments</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #FBF8F0; border: 1px solid #A99E86; color: #5E564A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
<input type="search" placeholder="Search events, files and members" style="flex: 1 1 auto; min-width: 0; min-height: 40px; border: 0; background: transparent; font: 16px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
<div style="position: relative">
<button type="button" aria-label="{{bar.bellLabel}}" aria-expanded="{{bar.notifExp}}" onClick="{{bar.toggleNotif}}" style="position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; color: #231F1A; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
<sc-if value="{{bar.showBadge}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #7A2A1C; color: #FFFFFF; font: 600 13px/20px 'EB Garamond', Georgia, serif; text-align: center">4</span></sc-if>
</button>
<sc-if value="{{bar.notifOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Notifications" style="position: absolute; right: 0; top: 52px; width: 360px; max-width: 80vw; z-index: 20; background: #FBF8F0; border: 1px solid #A99E86; border-radius: 10px; box-shadow: 0 14px 36px rgba(35,31,26,0.24); padding: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px">
<strong style="font-size: 17px">Notifications</strong>
<button type="button" onClick="{{bar.markRead}}" style="min-height: 36px; border: 0; background: transparent; color: #7A2A1C; font: 600 15px 'EB Garamond', Georgia, serif; cursor: pointer">Mark all read</button>
</div>
<sc-for list="{{bar.notes}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="{{n.style}}"><span style="display: block; font-size: 16px; color: #231F1A">{{n.text}}</span><span style="display: block; font-size: 14px; color: #5E564A">{{n.when}}</span></a>
</sc-for>
</div>
</sc-if>
</div>
<div style="position: relative">
<button type="button" aria-expanded="{{bar.userExp}}" onClick="{{bar.toggleUser}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; cursor: pointer; font: 16px 'EB Garamond', Georgia, serif; color: #231F1A">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #2B2620; color: #EDE6D6; display: inline-flex; align-items: center; justify-content: center; font: 400 19px 'UnifrakturMaguntia', serif">G</span>
<span style="text-align: left; line-height: 1.15"><span style="display: block; font-weight: 600">Gorm</span><span style="display: block; font-size: 14px; color: #5E564A">Group leader</span></span>
</button>
<sc-if value="{{bar.userOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 0; top: 52px; width: 240px; z-index: 20; background: #FBF8F0; border: 1px solid #A99E86; border-radius: 10px; box-shadow: 0 14px 36px rgba(35,31,26,0.24); padding: 6px; display: flex; flex-direction: column">
<a href="members.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: #231F1A; text-decoration: none; font-size: 16px">My profile</a>
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: #231F1A; text-decoration: none; font-size: 16px">Notification settings</a>
<a href="parent.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: #231F1A; text-decoration: none; font-size: 16px">See what parents see</a>
</div>
</sc-if>
</div>
</header>
<figure style="margin: 0">
<img src="panorama.svg" alt="A winter landscape in the manner of Bruegel: hunters and dogs trudge home past a tavern fire, villagers skate and joust on a frozen pond below a snowy Galway village, crows on bare trees, a piñata hangs from a branch a man squats behind a bush, and Gorm rides by on a small horse smoking an enormous joint." style="display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid #BFB49A"/>
<figcaption style="margin-top: 6px; font-size: 14px; font-style: italic; color: #5E564A">Galway in midwinter, after Pieter Bruegel the Elder's Hunters in the Snow (1565). Thirty-six days to Christmas.</figcaption>
</figure>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700">Events &amp; availability</h1>
<div style="font-size: 16px; color: #5E564A; margin-top: 4px">Pick an event, say whether you can make it, and see if enough leaders are coming.</div>
</div>
<button type="button" onClick="{{openNew}}" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #7A2A1C; color: #FFFFFF; font: 600 16px 'EB Garamond', Georgia, serif; cursor: pointer">New event</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div role="list" aria-label="Upcoming events" style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{events}}" as="ev" hint-placeholder-count="4">
<button type="button" role="listitem" onClick="{{ev.pick}}" style="{{ev.cardStyle}}">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
<span style="font-weight: 600; font-size: 16px">{{ev.title}}</span>
<span style="{{ev.badgeStyle}}">{{ev.badge}}</span>
</span>
<span style="display: block; font-size: 15px; color: #5E564A; margin-top: 4px">{{ev.when}}</span>
</button>
</sc-for>
</div>

<section aria-labelledby="ev-h" style="flex: 2 1 460px; min-width: 0; background: #FBF8F0; border-radius: 12px; border: 1px solid #D6CDB6; padding: 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div>
<h2 id="ev-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 26px">{{cur.title}}</h2>
<div style="font-size: 16px; color: #5E564A; margin-top: 4px">{{cur.when}} · {{cur.place}}</div>
</div>
<span style="{{cur.badgeStyle}}">{{cur.badge}}</span>
</div>

<div style="margin-top: 20px">
<div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 500"><span>{{cur.confirmed}} of {{cur.needed}} leaders confirmed</span><span style="color: #5E564A">Minimum needed: {{cur.needed}}</span></div>
<div style="height: 10px; border-radius: 5px; background: #DDD5C2; margin-top: 8px"><div style="{{cur.barStyle}}"></div></div>
</div>

<div style="margin-top: 24px; padding: 16px; border-radius: 10px; background: #E9E2CF; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div style="flex: 1 1 200px; font-size: 16px"><strong>Can you make it?</strong> <span style="color: #5E564A">Your answer: {{cur.myLabel}}</span></div>
<button type="button" onClick="{{setYes}}" style="{{yesStyle}}">I'm available</button>
<button type="button" onClick="{{setMaybe}}" style="{{maybeStyle}}">Maybe</button>
<button type="button" onClick="{{setNo}}" style="{{noStyle}}">Can't make it</button>
</div>

<h3 style="margin: 24px 0 8px; font-size: 16px; color: #433B30">Leaders</h3>
<div role="list" style="display: flex; flex-direction: column">
<sc-for list="{{cur.rows}}" as="r" hint-placeholder-count="7">
<div role="listitem" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #E3DCCB">
<span style="font-size: 16px">{{r.name}}</span>
<span style="{{r.pill}}">{{r.label}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<sc-if value="{{modal}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 50; background: rgba(35,31,26,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 64px 16px; box-sizing: border-box; overflow-y: auto">
<div role="dialog" aria-modal="true" aria-labelledby="ne-h" style="width: 100%; max-width: 520px; box-sizing: border-box; background: #FBF8F0; border: 1px solid #A99E86; border-radius: 14px; box-shadow: 0 24px 60px rgba(35,31,26,0.35); padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="ne-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 26px">New event</h2>
<button type="button" aria-label="Close" onClick="{{closeNew}}" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; color: #231F1A; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 600">Event name
<input type="text" placeholder="e.g. Lotería night" onChange="{{setTitle}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; background: #FFFFFF; font: 400 17px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 600">Date
<input type="date" onChange="{{setDate}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; background: #FFFFFF; font: 400 17px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 600">Start time
<input type="time" onChange="{{setTime}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; background: #FFFFFF; font: 400 17px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 600">Where
<input type="text" placeholder="e.g. Scout Den, Galway" onChange="{{setPlace}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; background: #FFFFFF; font: 400 17px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 600">Leaders needed
<input type="number" min="1" max="20" placeholder="4" onChange="{{setNeeded}}" style="min-height: 44px; width: 120px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; background: #FFFFFF; font: 400 17px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 44px">
<input type="checkbox" checked="checked" style="width: 20px; height: 20px; accent-color: #7A2A1C"/>
Parents must sign a consent form
</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 44px">
<input type="checkbox" checked="checked" style="width: 20px; height: 20px; accent-color: #7A2A1C"/>
Ask all leaders for their availability now
</label>
<sc-if value="{{formError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="font-size: 15px; color: #6B3110; background: #F1DEC0; border-radius: 8px; padding: 8px 12px">Give the event a name first.</div>
</sc-if>
<div style="display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{closeNew}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; color: #231F1A; font: 600 16px 'EB Garamond', Georgia, serif; cursor: pointer">Cancel</button>
<button type="button" onClick="{{createNew}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: #7A2A1C; color: #FFFFFF; font: 600 16px 'EB Garamond', Georgia, serif; cursor: pointer">Create event</button>
</div>
</div>
</div>
</sc-if>
</main>
</div>
</root></script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {

}
newEventVals() {

var parts = [];
if (d.date) {
var dt = new Date(d.date + 'T12:00:00');
if (!isNaN(dt)) parts.push(dt.toLocaleDateString('en-IE', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', ''));
}
if (d.time) parts.push(d.time);

}
return {

if (!d.title || !d.title.trim()) { self.setState({ formError: true }); return; }

var n = Math.max(1, Math.min(20, parseInt(d.needed, 10) || 4));
var ev = { id: id, title: d.title.trim(), when: when(d), place: (d.place && d.place.trim()) || 'Place to be confirmed', needed: n, st: ['none','none','none','none','none','none'] };
self.setState({ extra: ((self.state && self.state.extra) || []).concat([ev]), sel: id, modal: false, formError: false, draft: {} });
}
};
}
barVals() {
var self = this;
var s = this.state || {};
var read = !!s.barRead;
var notes = [
{ text: "Paul F. can't make the jousting tournament. It's now one leader short.", when: '12 minutes ago', href: 'events.html' },
{ text: "Saoirse K.'s Term 1 subs are 21 days overdue.", when: 'Today, 09:00', href: 'payments.html' },
{ text: 'Mary K. uploaded the jousting kit list.', when: 'Tue 17 Nov', href: 'files.html' },
{ text: 'Galway City Council grant closes in 8 days.', when: 'Thu 19 Nov', href: 'index.html' }
].map(function (n) {
return Object.assign({}, n, { style: 'display: block; padding: 10px; border-radius: 6px; text-decoration: none; ' + (read ? 'background: transparent' : 'background: #EFE7D4') });
});
return {
notes: notes,
showBadge: !read,
bellLabel: read ? 'Notifications' : 'Notifications, 4 unread',

notifExp: s.barMenu === 'n' ? 'true' : 'false', userExp: s.barMenu === 'u' ? 'true' : 'false',

}
renderVals() {

var data = [

{ id: 'hike', title: 'Cornholio jousting tournament', when: 'Sun 6 Dec · 11:00', place: 'South Park, Galway (pool noodles only)', needed: 4, st: ['yes','yes','yes','no','maybe','none'] },
{ id: 'carols', title: 'Taco night fundraiser', when: 'Sat 12 Dec · 17:00', place: 'Scout Den, Galway', needed: 6, st: ['yes','yes','yes','yes','yes','yes'] },
{ id: 'party', title: 'Las Posadas Christmas party', when: 'Fri 18 Dec · 18:30', place: 'Scout Den, Galway · piñata and papel picado', needed: 4, st: ['yes','none','none','none','yes','none'] }
].concat((this.state && this.state.extra) || []);
var labels = { yes: 'Available', maybe: 'Maybe', no: "Can't make it", none: 'No reply' };

yes: 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #DFE4D0; color: #3B5230',
maybe: 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #F1DEC0; color: #6B3110',

none: 'padding: 3px 9px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #FBF8F0; color: #5E564A; border: 1px solid #A99E86'
};
var okBadge = 'flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #DFE4D0; color: #3B5230';
var shortBadge = 'flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #F1DEC0; color: #6B3110';
var events = data.map(function (ev) {
var me = mine[ev.id] || 'none';
var rows = [{ name: 'You (Gorm)', st: me }].concat(leaders.map(function (n, i) { return { name: n, st: ev.st[i] }; }));
rows = rows.map(function (r) { return { name: r.name, label: labels[r.st], pill: pills[r.st] }; });
var confirmed = [me].concat(ev.st).filter(function (s) { return s === 'yes'; }).length;
var short = Math.max(0, ev.needed - confirmed);
var pct = Math.min(100, Math.round(confirmed / ev.needed * 100));
var active = ev.id === sel;
return {
id: ev.id, title: ev.title, when: ev.when, place: ev.place, needed: ev.needed, confirmed: confirmed, rows: rows,
myLabel: labels[me],
badge: short === 0 ? 'Covered' : 'Short ' + short,
badgeStyle: short === 0 ? okBadge : shortBadge,
barStyle: 'height: 10px; border-radius: 5px; width: ' + pct + '%; background: ' + (short === 0 ? '#7A2A1C' : '#A8581A'),
cardStyle: 'display: block; width: 100%; text-align: left; font: inherit; color: #231F1A; cursor: pointer; padding: 16px; border-radius: 10px; background: #FBF8F0; border: ' + (active ? '2px solid #7A2A1C' : '1px solid #D6CDB6') + '; margin: ' + (active ? '0' : '1px 0'),
pick: function () { self.setState({ sel: ev.id }); }
};
});
var cur = events.filter(function (e) { return e.id === sel; })[0] || events[0];
var curMine = mine[cur.id] || 'none';
function setMine(v) { var m = Object.assign({}, mine); m[cur.id] = v; self.setState({ mine: m }); }
function btn(on) {
return 'min-height: 44px; padding: 0 16px; border-radius: 8px; font: 600 15px EB Garamond, Georgia, serif; cursor: pointer; ' + (on ? 'background: #7A2A1C; color: #FFFFFF; border: 1px solid #7A2A1C' : 'background: #FBF8F0; color: #231F1A; border: 1px solid #A99E86');
}
return Object.assign(this.newEventVals(), {
bar: this.barVals(),
events: events, cur: cur,
setYes: function () { setMine('yes'); },
setMaybe: function () { setMine('maybe'); },
setNo: function () { setMine('no'); },
yesStyle: btn(curMine === 'yes'), maybeStyle: btn(curMine === 'maybe'), noStyle: btn(curMine === 'no')
});
}
}
</script>
