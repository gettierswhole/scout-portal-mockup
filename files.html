<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout portal — Files</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=IM+Fell+English:ital@0;1&amp;family=UnifrakturMaguntia&amp;display=swap">
<style>
body{margin:0;background:#E9E2CF}
a{color:#7A2A1C}a:hover{color:#5A1C12}
</style>
<script src="dc-runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template"><root>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'EB Garamond', Georgia, serif; color: #231F1A; background: #E9E2CF">
<nav aria-label="Main" style="flex: 1 1 220px; box-sizing: border-box; background: #2B2620; color: #F3F1EA; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 26px; padding: 0 12px 4px">The Great Cornholio!</div>
<div style="font-size: 14px; color: #CFC4AE; padding: 0 12px 20px">Galway Scouts · Leaders' portal</div>
<a href="index.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Dashboard</a>
<a href="events.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events &amp; availability</a>
<a href="files.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Files</a>
<a href="payments.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 10h20"></path></svg>Subs &amp; payments</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<figure style="margin: 0">
<img src="panorama.svg" alt="A winter landscape in the manner of Bruegel: hunters and dogs trudge home past a tavern fire, villagers skate and joust on a frozen pond below a snowy Galway village, crows on bare trees, a piñata hangs from a branch a man squats behind a bush, and Vinny rides by on a small horse smoking an enormous joint." style="display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid #BFB49A"/>
<figcaption style="margin-top: 6px; font-size: 14px; font-style: italic; color: #5E564A">Galway in midwinter, after Pieter Bruegel the Elder's Hunters in the Snow (1565). Thirty-six days to Christmas.</figcaption>
</figure>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700">Files</h1>
<div style="font-size: 16px; color: #5E564A; margin-top: 4px">One place for every form, kit list and policy — no more digging through WhatsApp.</div>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #7A2A1C; color: #FFFFFF; font: 600 15px 'EB Garamond', Georgia, serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg>Upload file</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div aria-label="Folders" style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="6">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">
<span>{{f.name}}</span>
<span style="font-size: 14px; color: #5E564A; font-weight: 500">{{f.count}}</span>
</button>
</sc-for>
</div>

<section aria-labelledby="fl-h" style="flex: 3 1 480px; min-width: 0; background: #FBF8F0; border-radius: 12px; border: 1px solid #D6CDB6; padding: 20px 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="fl-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 20px">{{folderName}}</h2>
<label style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #433B30">Search
<input type="search" placeholder="File name" style="min-height: 40px; width: 220px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; font: 15px 'EB Garamond', Georgia, serif"/>
</label>
</div>
<div style="overflow-x: auto; margin-top: 12px">
<table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 16px">
<thead>
<tr style="text-align: left; color: #5E564A; font-size: 14px">
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Name</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Folder</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Added by</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Date</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
</tr>
</thead>
<tbody>
<sc-for list="{{files}}" as="x" hint-placeholder-count="6">
<tr>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB"><span style="display: inline-flex; align-items: center; gap: 10px"><span style="{{x.typeStyle}}">{{x.type}}</span><span style="font-weight: 500">{{x.name}}</span></span></td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A">{{x.folder}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A">{{x.by}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A">{{x.date}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; text-align: right"><a href="#" style="font-weight: 600; font-size: 15px">Download</a></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="margin-top: 16px; font-size: 14px; color: #5E564A">Who can see what: leaders see every folder; parents only see folders marked “Shared with parents” (Forms &amp; consent, Camp &amp; event info).</div>
</section>
</div>
</main>
</div>
</root></script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { folder: 'all' };
}
renderVals() {
var self = this;
var sel = (this.state && this.state.folder) || 'all';
var all = [
{ name: 'Jousting kit list (noodles & helmets)', folder: 'Camp & event info', by: 'Mary K.', date: '17 Nov 2026', type: 'PDF' },
{ name: 'Consent form — jousting tournament', folder: 'Forms & consent', by: 'Mary K.', date: '17 Nov 2026', type: 'DOCX' },
{ name: 'Galway City Council grant draft', folder: 'Funding & grants', by: 'Vinny', date: '15 Nov 2026', type: 'DOCX' },
{ name: 'Papel picado templates', folder: 'Camp & event info', by: 'Gráinne D.', date: '10 Nov 2026', type: 'PDF' },
{ name: 'Minutes — October meeting', folder: 'Meeting minutes', by: 'Declan O.', date: '3 Nov 2026', type: 'PDF' },
{ name: 'Medical and contact form', folder: 'Forms & consent', by: 'Niamh B.', date: '1 Sep 2026', type: 'PDF' },
{ name: 'Child safeguarding statement', folder: 'Policies & safeguarding', by: 'Declan O.', date: '28 Aug 2026', type: 'PDF' },
{ name: 'Taco night rota & shopping list', folder: 'Camp & event info', by: 'Paul F.', date: '12 Nov 2026', type: 'XLSX' },
{ name: 'Grant budget breakdown', folder: 'Funding & grants', by: 'Vinny', date: '15 Nov 2026', type: 'XLSX' }
];
var names = ['Forms & consent', 'Camp & event info', 'Policies & safeguarding', 'Meeting minutes', 'Funding & grants'];
function fStyle(on) {
return 'display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 44px; padding: 0 14px; border-radius: 8px; text-align: left; font: ' + (on ? '600' : '500') + ' 15px EB Garamond, Georgia, serif; color: #231F1A; cursor: pointer; background: ' + (on ? '#FFFFFF' : 'transparent') + '; border: ' + (on ? '1px solid #7A2A1C' : '1px solid transparent');
}
var folders = [{ id: 'all', name: 'All files' }].concat(names.map(function (n) { return { id: n, name: n }; })).map(function (f) {
var count = f.id === 'all' ? all.length : all.filter(function (x) { return x.folder === f.id; }).length;
return { name: f.name, count: count, pressed: f.id === sel ? 'true' : 'false', style: fStyle(f.id === sel), pick: function () { self.setState({ folder: f.id }); } };
});
var colors = { PDF: '#9B2C1F', DOCX: '#1D5FA8', XLSX: '#1F6B3A' };
var files = all.filter(function (x) { return sel === 'all' || x.folder === sel; }).map(function (x) {
return Object.assign({}, x, { typeStyle: 'display: inline-block; min-width: 40px; text-align: center; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: ' + colors[x.type] });
});
return { folders: folders, files: files, folderName: sel === 'all' ? 'All files' : sel };
}
}
</script>
</body>
</html>
