<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
constructor(props) {
super(props);
// Snapshot from Met Éireann, Fri 20 Nov 00:42. The published site replaces it with live data.
this.state = {
w: { temp: '5.9', tMin: '2.9', tMax: '8.0', wind: 17, dir: 'NE', bft: 'Gentle breeze', gust: 27, rain: '0.0', prob: 7, humidity: 88, pressure: 998, cloud: 99, updated: 'Fri 20 Nov, 00:42' },
live: false,
warnings: []
};
}
componentDidMount() {
if (typeof window === 'undefined' || !window.DC_LIVE_WEATHER) return;
var self = this;
fetch('https://openaccess.pf.api.met.ie/metno-wdb2ts/locationforecast?lat=53.53;long=-7.98')
.then(function (r) { return r.text(); })
.then(function (t) { self.setState({ w: self.parseMet(t), live: true }); })
.catch(function () {});
fetch('https://www.met.ie/Open_Data/json/warning_IRELAND.json')
.then(function (r) { return r.json(); })
.then(function (list) { if (Array.isArray(list)) self.setState({ warnings: list }); })
.catch(function () {});
}
parseMet(xmlText) {
var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
var times = Array.prototype.slice.call(doc.getElementsByTagName('time'));
var H = 3600000, now = Date.now(), end = now + 24 * H;
function g(t, tag, attr) { var e = t.getElementsByTagName(tag)[0]; return e ? parseFloat(e.getAttribute(attr)) : NaN; }
var inst = times.filter(function (t) { return t.getAttribute('from') === t.getAttribute('to'); });
var i24 = inst.filter(function (t) { var f = Date.parse(t.getAttribute('to')); return f > now - H && f <= end; });
var cur = i24[0] || inst[0];
var temps = i24.map(function (t) { return g(t, 'temperature', 'value'); });
var gusts = i24.map(function (t) { return g(t, 'windGust', 'mps'); });
var per = times.filter(function (t) { var f = Date.parse(t.getAttribute('from')), to = Date.parse(t.getAttribute('to')); return to - f === H && f >= now - H && to <= end; });
var rain = 0, prob = 0;
per.forEach(function (t) { rain += g(t, 'precipitation', 'value') || 0; prob = Math.max(prob, g(t, 'precipitation', 'probability') || 0); });
var wd = cur.getElementsByTagName('windDirection')[0], ws = cur.getElementsByTagName('windSpeed')[0];
var created = doc.documentElement.getAttribute('created');
return {
temp: g(cur, 'temperature', 'value').toFixed(1), tMin: Math.min.apply(null, temps).toFixed(1), tMax: Math.max.apply(null, temps).toFixed(1),
wind: Math.round(parseFloat(ws.getAttribute('mps')) * 3.6), dir: wd.getAttribute('name'), bft: ws.getAttribute('name'),
gust: Math.round(Math.max.apply(null, gusts) * 3.6), rain: rain.toFixed(1), prob: Math.round(prob),
humidity: Math.round(g(cur, 'humidity', 'value')), pressure: Math.round(g(cur, 'pressure', 'value')), cloud: Math.round(g(cur, 'cloudiness', 'percent')),
updated: new Date(created).toLocaleString('en-IE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Dublin' })
};
}
renderVals() {
var s = this.state || {};
var w = s.w || {};
var warnings = (s.warnings || []).map(function (x) {
return { level: (x.level || x.type || 'Warning') + ':', text: x.headline || x.description || x.regions || '' };
});
return {
wx: {
status: (s.live ? 'Live · updated ' : 'Snapshot · ') + w.updated,
tiles: [
{ label: 'Temperature', value: w.temp, unit: '°C', sub: 'Low ' + w.tMin + '° · high ' + w.tMax + '°' },
{ label: 'Wind', value: w.wind, unit: 'km/h', sub: w.dir + ' · ' + w.bft },
{ label: 'Gusts', value: w.gust, unit: 'km/h', sub: 'Strongest in the next 24 h' },
{ label: 'Rain', value: w.rain, unit: 'mm', sub: 'Next 24 h · up to ' + w.prob + '% chance' },
{ label: 'Humidity', value: w.humidity, unit: '%', sub: 'Cloud cover ' + w.cloud + '%' },
{ label: 'Pressure', value: w.pressure, unit: 'hPa', sub: w.pressure < 1000 ? 'Low: unsettled' : 'Settled' }
]
},
warnings: warnings,
hasWarnings: warnings.length > 0,
noWarnings: warnings.length === 0
};
}
}
</script>
