<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout portal — Members</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=IM+Fell+English:ital@0;1&amp;family=UnifrakturMaguntia&amp;display=swap">
<style>
body{margin:0;background:#E9E2CF}
a{color:#7A2A1C}a:hover{color:#5A1C12}
</style>
<script src="dc-runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template"><root>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'EB Garamond', Georgia, serif; color: #231F1A; background: #E9E2CF">
<nav aria-label="Main" style="flex: 1 1 220px; box-sizing: border-box; background: #2B2620; color: #F3F1EA; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 26px; padding: 0 12px 4px">The Great Cornholio!</div>
<div style="font-size: 14px; color: #CFC4AE; padding: 0 12px 20px">Galway Scouts · Leaders' portal</div>
<a href="index.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Dashboard</a>
<a href="events.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events &amp; availability</a>
<a href="files.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Files</a>
<a href="members.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>Members</a>
<a href="payments.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 10h20"></path></svg>Subs &amp; payments</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #FBF8F0; border: 1px solid #A99E86; color: #5E564A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
<input type="search" placeholder="Search events, files and members" style="flex: 1 1 auto; min-width: 0; min-height: 40px; border: 0; background: transparent; font: 16px 'EB Garamond', Georgia, serif; color: #231F1A"/>
</label>
<div style="position: relative">
<button type="button" aria-label="{{bar.bellLabel}}" aria-expanded="{{bar.notifExp}}" onClick="{{bar.toggleNotif}}" style="position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; color: #231F1A; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
<sc-if value="{{bar.showBadge}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #7A2A1C; color: #FFFFFF; font: 600 13px/20px 'EB Garamond', Georgia, serif; text-align: center">4</span></sc-if>
</button>
<sc-if value="{{bar.notifOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Notifications" style="position: absolute; right: 0; top: 52px; width: 360px; max-width: 80vw; z-index: 20; background: #FBF8F0; border: 1px solid #A99E86; border-radius: 10px; box-shadow: 0 14px 36px rgba(35,31,26,0.24); padding: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px">
<strong style="font-size: 17px">Notifications</strong>
<button type="button" onClick="{{bar.markRead}}" style="min-height: 36px; border: 0; background: transparent; color: #7A2A1C; font: 600 15px 'EB Garamond', Georgia, serif; cursor: pointer">Mark all read</button>
</div>
<sc-for list="{{bar.notes}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="{{n.style}}"><span style="display: block; font-size: 16px; color: #231F1A">{{n.text}}</span><span style="display: block; font-size: 14px; color: #5E564A">{{n.when}}</span></a>
</sc-for>
</div>
</sc-if>
</div>
<div style="position: relative">
<button type="button" aria-expanded="{{bar.userExp}}" onClick="{{bar.toggleUser}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; cursor: pointer; font: 16px 'EB Garamond', Georgia, serif; color: #231F1A">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #2B2620; color: #EDE6D6; display: inline-flex; align-items: center; justify-content: center; font: 400 19px 'UnifrakturMaguntia', serif">G</span>
<span style="text-align: left; line-height: 1.15"><span style="display: block; font-weight: 600">Gorm</span><span style="display: block; font-size: 14px; color: #5E564A">Group leader</span></span>
</button>
<sc-if value="{{bar.userOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 0; top: 52px; width: 240px; z-index: 20; background: #FBF8F0; border: 1px solid #A99E86; border-radius: 10px; box-shadow: 0 14px 36px rgba(35,31,26,0.24); padding: 6px; display: flex; flex-direction: column">
<a href="members.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: #231F1A; text-decoration: none; font-size: 16px">My profile</a>
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: #231F1A; text-decoration: none; font-size: 16px">Notification settings</a>
<a href="parent.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: #231F1A; text-decoration: none; font-size: 16px">See what parents see</a>
</div>
</sc-if>
</div>
</header>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700">Members</h1>
<div style="font-size: 16px; color: #5E564A; margin-top: 4px">Who's in the group, and whose paperwork needs doing. Contact details are visible to leaders only.</div>
</div>
<button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #7A2A1C; color: #FFFFFF; font: 600 16px 'EB Garamond', Georgia, serif; cursor: pointer">Invite a member</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px">
<div style="background: #FBF8F0; border-radius: 12px; padding: 18px; border: 1px solid #D6CDB6"><div style="font-size: 15px; color: #5E564A">Beavers · 6–8</div><div style="font-family: 'IM Fell English', Georgia, serif; font-size: 32px; margin-top: 4px">2</div></div>
<div style="background: #FBF8F0; border-radius: 12px; padding: 18px; border: 1px solid #D6CDB6"><div style="font-size: 15px; color: #5E564A">Cubs · 9–11</div><div style="font-family: 'IM Fell English', Georgia, serif; font-size: 32px; margin-top: 4px">3</div></div>
<div style="background: #FBF8F0; border-radius: 12px; padding: 18px; border: 1px solid #D6CDB6"><div style="font-size: 15px; color: #5E564A">Scouts · 12–15</div><div style="font-family: 'IM Fell English', Georgia, serif; font-size: 32px; margin-top: 4px">4</div></div>
<div style="background: #FBF8F0; border-radius: 12px; padding: 18px; border: 1px solid #D6CDB6"><div style="font-size: 15px; color: #5E564A">Ventures · 15–18</div><div style="font-family: 'IM Fell English', Georgia, serif; font-size: 32px; margin-top: 4px">3</div></div>
<div style="background: #FBF8F0; border-radius: 12px; padding: 18px; border: 1px solid #D6B788"><div style="font-size: 15px; color: #6B3110; font-weight: 600">Vetting due soon</div><div style="font-family: 'IM Fell English', Georgia, serif; font-size: 32px; margin-top: 4px; color: #6B3110">2</div></div>
</div>

<section aria-labelledby="mb-h" style="background: #FBF8F0; border-radius: 12px; border: 1px solid #D6CDB6; padding: 20px 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="mb-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 22px">{{heading}}</h2>
<div role="group" aria-label="Show" style="display: flex; gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="overflow-x: auto; margin-top: 12px">
<sc-if value="{{showLeaders}}" hint-placeholder-val="{{ true }}">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 16px">
<thead>
<tr style="text-align: left; color: #5E564A; font-size: 14px">
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Name</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Role</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Garda vetting</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Safeguarding training</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Phone</th>
</tr>
</thead>
<tbody>
<sc-for list="{{leaders}}" as="l" hint-placeholder-count="7">
<tr>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; font-weight: 600">{{l.name}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #433B30">{{l.role}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB"><span style="{{l.vetPill}}">{{l.vet}}</span></td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #433B30">{{l.training}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A; font-variant-numeric: tabular-nums">{{l.phone}}</td>
</tr>
</sc-for>
</tbody>
</table>
</sc-if>
<sc-if value="{{showYouth}}" hint-placeholder-val="{{ false }}">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 16px">
<thead>
<tr style="text-align: left; color: #5E564A; font-size: 14px">
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Name</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Section</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Medical &amp; contact form</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Photo consent</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Parent contact</th>
</tr>
</thead>
<tbody>
<sc-for list="{{youth}}" as="y" hint-placeholder-count="12">
<tr>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; font-weight: 600">{{y.name}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #433B30">{{y.section}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB"><span style="{{y.medPill}}">{{y.med}}</span></td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #433B30">{{y.photo}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A">{{y.parent}}</td>
</tr>
</sc-for>
</tbody>
</table>
</sc-if>
</div>
<div style="margin-top: 14px; font-size: 14px; color: #5E564A">Contact details are partly hidden here; leaders see the full number on a member's profile. Youth records are kept in line with GDPR and the group's child safeguarding statement.</div>
</section>
</main>
</div>
</root></script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'leaders' };
}
barVals() {
var self = this;
var s = this.state || {};
var read = !!s.barRead;
var notes = [
{ text: "Paul F. can't make the jousting tournament. It's now one leader short.", when: '12 minutes ago', href: 'events.html' },
{ text: "Saoirse K.'s Term 1 subs are 21 days overdue.", when: 'Today, 09:00', href: 'payments.html' },
{ text: 'Mary K. uploaded the jousting kit list.', when: 'Tue 17 Nov', href: 'files.html' },
{ text: 'Galway City Council grant closes in 8 days.', when: 'Thu 19 Nov', href: 'index.html' }
].map(function (n) {
return Object.assign({}, n, { style: 'display: block; padding: 10px; border-radius: 6px; text-decoration: none; ' + (read ? 'background: transparent' : 'background: #EFE7D4') });
});
return {
notes: notes,
showBadge: !read,
bellLabel: read ? 'Notifications' : 'Notifications, 4 unread',
notifOpen: s.barMenu === 'n', userOpen: s.barMenu === 'u',
notifExp: s.barMenu === 'n' ? 'true' : 'false', userExp: s.barMenu === 'u' ? 'true' : 'false',
toggleNotif: function () { self.setState({ barMenu: s.barMenu === 'n' ? null : 'n' }); },
toggleUser: function () { self.setState({ barMenu: s.barMenu === 'u' ? null : 'u' }); },
markRead: function () { self.setState({ barRead: true }); }
};
}
renderVals() {
var self = this;
var tab = (this.state && this.state.tab) || 'leaders';
var ok = 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #DFE4D0; color: #3B5230; white-space: nowrap';
var warn = 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #F1DEC0; color: #6B3110; white-space: nowrap';
var leaders = [
{ name: 'Gorm', role: 'Group leader', vet: 'Valid to Sep 2028', soon: false, training: 'Feb 2026', phone: '087 ••• ••31' },
{ name: 'Mary K.', role: 'Scouts leader', vet: 'Valid to Mar 2028', soon: false, training: 'Oct 2025', phone: '086 ••• ••07' },
{ name: 'Declan O.', role: 'Cubs leader · secretary', vet: 'Valid to Jun 2027', soon: false, training: 'Jan 2026', phone: '085 ••• ••64' },
{ name: 'Niamh B.', role: 'Beavers leader', vet: 'Valid to Nov 2028', soon: false, training: 'Sep 2026', phone: '087 ••• ••19' },
{ name: 'Paul F.', role: 'Ventures leader', vet: 'Expires 31 Jan 2027', soon: true, training: 'Mar 2024', phone: '083 ••• ••52' },
{ name: 'Gráinne D.', role: 'Treasurer · Cubs helper', vet: 'Valid to Apr 2028', soon: false, training: 'May 2026', phone: '086 ••• ••88' },
{ name: 'Tom H.', role: 'Cubs assistant leader', vet: 'Expires 31 Jan 2027', soon: true, training: 'Nov 2024', phone: '089 ••• ••40' }
].map(function (l) { return Object.assign({}, l, { vetPill: l.soon ? warn : ok }); });
var youth = [
['Aoife M.', 'Beavers', true, 'Yes', 'Ciara M.'], ['Cian O.', 'Beavers', true, 'Yes', 'Dara O.'],
['Saoirse K.', 'Cubs', false, 'No', 'Karen K.'], ['Oisín R.', 'Cubs', true, 'Yes', 'Brian R.'], ['Ella D.', 'Cubs', true, 'Yes', 'Sinéad D.'],
['Fionn B.', 'Scouts', true, 'Yes', 'Ronan B.'], ['Ruby T.', 'Scouts', false, 'Yes', 'Aisling T.'], ['Darragh N.', 'Scouts', true, 'No', 'Eoin N.'], ['Lily F.', 'Scouts', true, 'Yes', 'Orla F.'],
['Conor W.', 'Ventures', true, 'Yes', 'Mark W.'], ['Maeve S.', 'Ventures', true, 'Yes', 'Fiona S.'], ['Jack L.', 'Ventures', true, 'Yes', 'Gerry L.']
].map(function (r) { return { name: r[0], section: r[1], med: r[2] ? 'On file' : 'Missing', medPill: r[2] ? ok : warn, photo: r[3], parent: r[4] }; });
function tabStyle(on) {
return 'min-height: 36px; padding: 0 14px; border-radius: 999px; font: 600 15px EB Garamond, Georgia, serif; cursor: pointer; ' + (on ? 'background: #7A2A1C; color: #FFFFFF; border: 1px solid #7A2A1C' : 'background: #FBF8F0; color: #231F1A; border: 1px solid #A99E86');
}
var tabs = [{ id: 'leaders', label: 'Leaders (7)' }, { id: 'youth', label: 'Youth members (12)' }].map(function (t) {
return { label: t.label, pressed: t.id === tab ? 'true' : 'false', style: tabStyle(t.id === tab), pick: function () { self.setState({ tab: t.id }); } };
});
return {
bar: this.barVals(),

tabs: tabs, leaders: leaders, youth: youth,
showLeaders: tab === 'leaders', showYouth: tab === 'youth',
heading: tab === 'leaders' ? 'Leaders and volunteers' : 'Youth members'
};
}
}
</script>
</body>
</html>
