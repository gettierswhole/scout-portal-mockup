<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout portal — Subs and payments</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=IM+Fell+English:ital@0;1&amp;family=UnifrakturMaguntia&amp;display=swap">
<style>
body{margin:0;background:#E9E2CF}
a{color:#7A2A1C}a:hover{color:#5A1C12}
</style>
<script src="dc-runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template"><root>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'EB Garamond', Georgia, serif; color: #231F1A; background: #E9E2CF">
<nav aria-label="Main" style="flex: 1 1 220px; box-sizing: border-box; background: #2B2620; color: #F3F1EA; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 26px; padding: 0 12px 4px">The Great Cornholio!</div>
<div style="font-size: 14px; color: #CFC4AE; padding: 0 12px 20px">Galway Scouts · Leaders' portal</div>
<a href="index.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Dashboard</a>
<a href="events.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events &amp; availability</a>
<a href="files.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #EDE6D6; text-decoration: none; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Files</a>
<a href="payments.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 10h20"></path></svg>Subs &amp; payments</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<figure style="margin: 0">
<img src="panorama.svg" alt="A winter landscape in the manner of Bruegel: hunters and dogs trudge home past a tavern fire, villagers skate and joust on a frozen pond below a snowy Galway village, crows on bare trees, a piñata hangs from a branch and a man squats behind a bush." style="display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid #BFB49A"/>
<figcaption style="margin-top: 6px; font-size: 14px; font-style: italic; color: #5E564A">Galway in midwinter, after Pieter Bruegel the Elder's Hunters in the Snow (1565). Thirty-six days to Christmas.</figcaption>
</figure>
<div>
<h1 style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700">Subs &amp; payments</h1>
<div style="font-size: 16px; color: #5E564A; margin-top: 4px">Term 1 2026 · subs of €[AMOUNT] per youth member, due Fri 30 Oct</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div style="background: #FBF8F0; border-radius: 12px; padding: 20px; border: 1px solid #D6CDB6">
<div style="font-size: 14px; color: #5E564A; font-weight: 500">Paid</div>
<div style="font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700; margin-top: 6px; color: #3B5230">{{nPaid}}</div>
</div>
<div style="background: #FBF8F0; border-radius: 12px; padding: 20px; border: 1px solid #D6CDB6">
<div style="font-size: 14px; color: #5E564A; font-weight: 500">On a payment plan</div>
<div style="font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700; margin-top: 6px">{{nPlan}}</div>
</div>
<div style="background: #FBF8F0; border-radius: 12px; padding: 20px; border: 1px solid #D6B788">
<div style="font-size: 14px; color: #6B3110; font-weight: 600">Overdue</div>
<div style="font-family: 'IM Fell English', Georgia, serif; font-size: 34px; font-weight: 700; margin-top: 6px; color: #6B3110">{{nOver}}</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-labelledby="pm-h" style="flex: 3 1 520px; min-width: 0; background: #FBF8F0; border-radius: 12px; border: 1px solid #D6CDB6; padding: 20px 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="pm-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 20px">Youth members</h2>
<div role="group" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="overflow-x: auto; margin-top: 12px">
<table style="width: 100%; min-width: 600px; border-collapse: collapse; font-size: 16px">
<thead>
<tr style="text-align: left; color: #5E564A; font-size: 14px">
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Member</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Section</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Status</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6">Detail</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid #D6CDB6"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<tr>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; font-weight: 500">{{r.name}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A">{{r.section}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB"><span style="{{r.pill}}">{{r.label}}</span></td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; color: #5E564A; font-size: 15px">{{r.detail}}</td>
<td style="padding: 12px 8px; border-bottom: 1px solid #E3DCCB; text-align: right">
<sc-if value="{{r.canRemind}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #A99E86; background: #FBF8F0; font: 600 14px 'EB Garamond', Georgia, serif; color: #231F1A; cursor: pointer">Send reminder</button></sc-if>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<aside aria-labelledby="po-h" style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #2B2620; color: #F3F1EA; border-radius: 12px; padding: 20px">
<h2 id="po-h" style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 18px">Online payments</h2>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #E0D7C4">Parents get a link to pay by card or set up a direct debit. Payment is handled by [payment provider], so card and bank details never touch the portal.</p>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: #E0D7C4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Paid status updates automatically</div>
</div>
<div style="background: #FBF8F0; border-radius: 12px; border: 1px solid #D6CDB6; padding: 20px">
<h3 style="margin: 0; font-size: 16px">Who sees this page</h3>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #5E564A">Treasurer and group leader only. Parents see just their own child's balance and a Pay button.</p>
</div>
</aside>
</div>
</main>
</div>
</root></script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
var self = this;
var f = (this.state && this.state.filter) || 'all';
var data = [
{ name: 'Aoife M.', section: 'Beavers', st: 'paid', detail: 'Card · 21 Oct' },
{ name: 'Cian O.', section: 'Beavers', st: 'paid', detail: 'Direct debit · 30 Oct' },
{ name: 'Saoirse K.', section: 'Cubs', st: 'over', detail: 'Due 30 Oct · 2 reminders sent' },
{ name: 'Oisín R.', section: 'Cubs', st: 'paid', detail: 'Cash, logged by Mary K. · 24 Oct' },
{ name: 'Ella D.', section: 'Cubs', st: 'plan', detail: '2 of 3 paid · next 1 Dec' },
{ name: 'Fionn B.', section: 'Scouts', st: 'paid', detail: 'Card · 19 Oct' },
{ name: 'Ruby T.', section: 'Scouts', st: 'paid', detail: 'Direct debit · 30 Oct' },
{ name: 'Darragh N.', section: 'Scouts', st: 'plan', detail: '1 of 3 paid · next 1 Dec' },
{ name: 'Lily F.', section: 'Scouts', st: 'paid', detail: 'Card · 27 Oct' },
{ name: 'Conor W.', section: 'Ventures', st: 'paid', detail: 'Direct debit · 30 Oct' },
{ name: 'Maeve S.', section: 'Ventures', st: 'plan', detail: '2 of 3 paid · next 1 Dec' },
{ name: 'Jack L.', section: 'Ventures', st: 'paid', detail: 'Card · 22 Oct' }
];
var labels = { paid: 'Paid', plan: 'Payment plan', over: 'Overdue' };
var pills = {
paid: 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #DFE4D0; color: #3B5230',
plan: 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #DCE3E3; color: #2E4A5C',
over: 'padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #F1DEC0; color: #6B3110'
};
function count(s) { return data.filter(function (d) { return d.st === s; }).length; }
var tabDefs = [{ id: 'all', label: 'All (' + data.length + ')' }, { id: 'over', label: 'Overdue (' + count('over') + ')' }, { id: 'plan', label: 'Plan (' + count('plan') + ')' }, { id: 'paid', label: 'Paid (' + count('paid') + ')' }];
var tabs = tabDefs.map(function (t) {
var on = t.id === f;
return { label: t.label, pressed: on ? 'true' : 'false', pick: function () { self.setState({ filter: t.id }); },
style: 'min-height: 36px; padding: 0 12px; border-radius: 999px; font: 600 14px EB Garamond, Georgia, serif; cursor: pointer; ' + (on ? 'background: #7A2A1C; color: #FFFFFF; border: 1px solid #7A2A1C' : 'background: #FBF8F0; color: #231F1A; border: 1px solid #A99E86') };
});
var order = { over: 0, plan: 1, paid: 2 };
var rows = data.filter(function (d) { return f === 'all' || d.st === f; }).slice().sort(function (a, b) { return order[a.st] - order[b.st]; }).map(function (d) {
return { name: d.name, section: d.section, detail: d.detail, label: labels[d.st], pill: pills[d.st], canRemind: d.st === 'over' };
});
return { tabs: tabs, rows: rows, nPaid: count('paid'), nPlan: count('plan'), nOver: count('over') };
}
}
</script>
</body>
</html>
